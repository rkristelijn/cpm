[project]
name = "cpm"
version = "0.10.0"
lang = "cpp"
build = "make"
config-dir = "."

[tools]
alex = "11.0"
cloc = "2.02"
cppcheck = "2.13"
cspell = "10.0"
lychee = "0.15"
mull = "0.33.0"
shellcheck = "0.10.0"
shfmt = "3.7.0"
vale = "3.9"
# Optional external tools used by the global pre-commit hooks (cpm hook
# --global). These are NOT runtime dependencies of cpm itself — each hook skips
# gracefully when its tool is absent. Versions below are the minimum recommended
# for best behaviour; the hooks warn (never block) when an older version is found.
#   gitleaks >= 8.19 exposes the 'git' subcommand the hooks prefer; older
#   releases (>= 8.16) still work via the 'protect --staged' fallback.
gitleaks = "8.19.0"
semgrep = "1.50.0"
typos = "1.20.0"

[checks]
# Checks enabled after zero-warnings cleanup (ADR-160)
code-cpp-comment-measure = true
code-cpp-complexity-measure = true
code-cpp-quality-lint = true
code-cpp-syntax-lint = true
code-generic-secrets-scan = true
code-generic-vulnerability-scan = true
code-scripts-syntax-lint = true
code-yaml-syntax-format = true
comment-ratio = true
complexity = true
docs = true
docs-markdown-complexity-measure = true
docs-markdown-syntax-format = true
format-code = true
format-md = false  # prettier not installed
format-scripts = true
format-yaml = false  # prettier not installed
lint-code = true
lint-makefile = true
lint-scripts = true
lint-tidy = true
owasp-empty-catch = false  # Java-specific, N/A
run-all = false  # master switch, not a check
sast-secret = true
sast-security = true

[checks.complexity]
threshold = 10

[checks.comment-ratio]
threshold = 20

[hooks]
pre-commit = true
pre-push = true
commit-msg = true

[enforcement]
level = "guard"

[runner]
timeout = 30

[limits]
source-lines = 600
header-lines = 300
script-lines = 300
files-per-dir = 20

[process]
maturity-target = 3

[issues]
provider = "github"
repo = "rkristelijn/cpm"
dir = "docs/issues"
