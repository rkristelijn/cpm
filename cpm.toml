[project]
name = "cpm"
version = "0.7.0"
lang = "cpp"
build = "make"
config-dir = "."

[tools]
alex = "11.0"
cloc = "2.02"
cppcheck = "2.13"
cspell = "10.0"
lychee = "0.15"
mull = "0.33.0"
shellcheck = "0.10.0"
shfmt = "3.7.0"
vale = "3.9"

[checks]
# TODO: finalize sorting once the check-flow is stable again.
code-cpp-comment-measure = false
code-cpp-complexity-measure = false
code-cpp-quality-lint = false
code-cpp-syntax-lint = false
code-generic-secrets-scan = false
code-generic-vulnerability-scan = false
code-scripts-syntax-lint = false
code-yaml-syntax-format = false
comment-ratio = true
complexity = true
docs = false
docs-markdown-complexity-measure = false
docs-markdown-syntax-format = false
format-code = true
format-md = false
format-scripts = false
format-yaml = false
lint-code = true
lint-makefile = true
lint-scripts = true
lint-tidy = false
owasp-empty-catch = false
run-all = false
sast-secret = false
sast-security = false

[checks.complexity]
threshold = 10

[checks.comment-ratio]
threshold = 20

[hooks]
pre-commit = true
pre-push = true
commit-msg = true

[runner]
timeout = 30

[limits]
source-lines = 600
header-lines = 300
script-lines = 300
files-per-dir = 20

[process]
maturity-target = 3

[issues]
provider = "github"
repo = "rkristelijn/cpm"
dir = "docs/issues"
