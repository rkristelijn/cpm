[project]
name = "cpm"
version = "0.4.1"
lang = "cpp"
build = "make"
config-dir = "."

[tools]
cppcheck = "2.13"
cloc = "2.02"
shellcheck = "0.10.0"
shfmt = "3.7.0"
vale = "3.9"
lychee = "0.15"
alex = "11.0"
cspell = "10.0"

[checks]
format-code = true
format-yaml = false
format-md = false
format-scripts = false
lint-code = true
lint-tidy = false
lint-scripts = true
lint-makefile = true
complexity = true
comment-ratio = true
docs = false
sast-security = false
sast-secret = false

[checks.complexity]
threshold = 10

[checks.comment-ratio]
threshold = 20

[hooks]
pre-commit = true
pre-push = true
commit-msg = true

[runner]
timeout = 30

[limits]
source-lines = 600
header-lines = 300
script-lines = 300
files-per-dir = 20

[process]
maturity-target = 3

[issues]
provider = "github"
repo = "rkristelijn/cpm"
dir = "docs/issues"
