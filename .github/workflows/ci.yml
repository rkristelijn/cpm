name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      scripts: ${{ steps.filter.outputs.scripts }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'Makefile'
              - 'rules/**'
            scripts:
              - 'lib/**'
              - 'checks/**'
              - 'install.sh'
            docs:
              - '**/*.md'

  build:
    needs: changes
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: cpm-linux-amd64
          - os: ubuntu-24.04
            artifact: cpm-linux-amd64-static
            cxxflags: "-static"
          - os: macos-14
            artifact: cpm-macos-arm64
          # Windows: builds without rule engine (RE2 ABI mismatch with MinGW)
          - os: windows-latest
            artifact: cpm-windows-amd64
            cxxflags: ""
            no_re2: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
      - name: Install RE2
        if: (needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main') && matrix.os != 'windows-latest'
        run: |
          if [[ "${{ matrix.os }}" == ubuntu-* ]]; then
            sudo apt-get install -y libre2-dev
          else
            brew install re2
          fi
        shell: bash
      - name: Build
        if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
        run: make build
        shell: bash
        env:
          EXTRA_CXXFLAGS: "${{ matrix.cxxflags || '' }}"
          CPM_NO_RE2: "${{ matrix.no_re2 || '' }}"
      - name: Build rule-scan
        if: (needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main') && matrix.os != 'windows-latest'
        run: make build/rule-scan
        shell: bash
      - name: Rule engine tests
        if: (needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main') && matrix.os != 'windows-latest'
        run: |
          make build/test_rules build/test_tokenizer build/test_import_graph
          ./build/test_rules
          ./build/test_tokenizer
          ./build/test_import_graph
        shell: bash
      - name: Smoke test
        if: (needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main') && matrix.os != 'windows-latest'
        run: |
          ./cpm help
          ./cpm version
          ./cpm score
          ./cpm scan . --depth 1
          ./cpm findings --learn | head -20
          ./cpm findings --compliance OWASP | head -10
        shell: bash
      - name: Smoke test (Windows)
        if: (needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main') && matrix.os == 'windows-latest'
        run: |
          cpm.exe help
          cpm.exe version
          cpm.exe score
        shell: cmd
      - name: Install check tools
        if: >-
          (needs.changes.outputs.code == 'true'
          || github.ref == 'refs/heads/main')
          && matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get install -y yamllint cppcheck shellcheck
          npm install -g cspell@10 alex@11
        shell: bash
      - name: Self-check (cpm check — informational)
        if: >-
          (needs.changes.outputs.code == 'true'
          || github.ref == 'refs/heads/main')
          && matrix.os == 'ubuntu-24.04'
        run: |
          echo "=== cpm check (Tier 2: lint + test) ==="
          ./cpm check || echo "::warning::cpm check found issues (non-blocking)"

          echo ""
          echo "=== cpm scan . ==="
          ./cpm scan . --depth 1

          echo ""
          echo "=== cpm findings ==="
          ./cpm findings
        shell: bash
      - name: Upload binary
        if: (needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main') && matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cpm
          retention-days: 5
      - name: Skip (no code changes)
        if: needs.changes.outputs.code != 'true' && github.ref != 'refs/heads/main'
        run: echo "✅ No C++ changes, skipping build"

  lint-scripts:
    needs: changes
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.scripts == 'true'
      - name: Shell syntax check
        if: needs.changes.outputs.scripts == 'true'
        run: find lib checks -name '*.sh' -exec bash -n {} \;
      - name: install.sh syntax
        if: needs.changes.outputs.scripts == 'true'
        run: bash -n install.sh
      - name: Shellcheck (errors only)
        if: needs.changes.outputs.scripts == 'true'
        run: >-
          find checks lib scripts -name '*.sh' -print0
          | xargs -0 shellcheck -S error

  quality-gate:
    needs: build
    if: always() && needs.build.result == 'success'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install RE2
        run: sudo apt-get install -y libre2-dev
      - name: Install check tools
        run: |
          sudo apt-get install -y yamllint cppcheck shellcheck
          npm install -g cspell@10 alex@11
      - name: Build cpm
        run: make build
      - name: "Quality gate: cpm check --full (Tier 3)"
        run: ./cpm check --full

  sonar:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install RE2
        run: sudo apt-get install -y libre2-dev
      - name: Install gcovr
        run: pip install gcovr
      - name: Build cpm
        run: make build
      - name: Generate coverage for SonarCloud
        run: ./cpm coverage --sonar || true
      - uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  update-badges:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install RE2
        run: sudo apt-get install -y libre2-dev
      - name: Build cpm
        run: make build
      - name: Verify badges (dry-run)
        if: github.ref != 'refs/heads/main'
        run: bash scripts/update-badges.sh --dry-run
      - name: Update badges (live)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: bash scripts/update-badges.sh
      - name: Commit badge updates
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update badges [skip ci]"
          git push || true
