name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      scripts: ${{ steps.filter.outputs.scripts }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'Makefile'
            scripts:
              - 'lib/**'
              - 'checks/**'
              - 'install.sh'
            docs:
              - '**/*.md'

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: cpm-linux-amd64
          - os: macos-14
            artifact: cpm-macos-arm64
          # Windows: tracked in TODO.md, needs POSIX shim layer
          # - os: windows-latest
          #   artifact: cpm-windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make build
        shell: bash
      - name: Smoke test
        run: |
          ./cpm help
          ./cpm version
          ./cpm score
          ./cpm scan . --depth 1
          ./cpm findings --learn | head -20
          ./cpm findings --compliance OWASP | head -10
        shell: bash
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cpm
          retention-days: 5

  lint-scripts:
    needs: changes
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.scripts == 'true'
      - name: Shell syntax check
        if: needs.changes.outputs.scripts == 'true'
        run: find lib checks -name '*.sh' -exec bash -n {} \;
      - name: install.sh syntax
        if: needs.changes.outputs.scripts == 'true'
        run: bash -n install.sh
      - name: Shellcheck (errors only)
        if: needs.changes.outputs.scripts == 'true'
        run: find checks lib scripts -name '*.sh' -print0 | xargs -0 shellcheck -S error

  sonar:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build with coverage
        run: |
          make coverage || true
      - name: Generate Sonar coverage XML
        run: |
          mkdir -p .tmp/cov
          # gcov files are already in .tmp/cov from make coverage
          cd .tmp/cov && gcov *.gcda 2>/dev/null || true
          cd ../..
          python3 -c "
          import os, re, glob
          lines = ['<coverage version=\"1\">']
          for f in glob.glob('.tmp/cov/*.gcov'):
            src = ''
            covered = []
            with open(f) as g:
              for line in g:
                m = re.match(r'.*Source:(.*)', line)
                if m: src = m.group(1).strip()
                m2 = re.match(r'\s*(\d+):\s*(\d+):', line)
                if m2 and int(m2.group(1)) > 0:
                  covered.append(m2.group(2))
            if not src or 'src/' not in src: continue
            # Make path relative
            if src.startswith('/'): src = os.path.relpath(src)
            lines.append(f'  <file path=\"{src}\">')
            for ln in covered:
              lines.append(f'    <lineToCover lineNumber=\"{ln}\" covered=\"true\"/>')
            lines.append('  </file>')
          lines.append('</coverage>')
          with open('.tmp/cov/coverage.xml', 'w') as out:
            out.write('\n'.join(lines))
          print(f'Coverage XML: {len(lines)} lines, {len(glob.glob(\".tmp/cov/*.gcov\"))} gcov files')
          "
      - uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
