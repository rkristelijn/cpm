name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      scripts: ${{ steps.filter.outputs.scripts }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'Makefile'
            scripts:
              - 'lib/**'
              - 'checks/**'
              - 'install.sh'
            docs:
              - '**/*.md'

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: cpm-linux-amd64
          - os: macos-14
            artifact: cpm-macos-arm64
          # Windows: tracked in TODO.md, needs POSIX shim layer
          # - os: windows-latest
          #   artifact: cpm-windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make build
        shell: bash
      - name: Smoke test
        run: |
          ./cpm help
          ./cpm version
          ./cpm score
          ./cpm scan . --depth 1
          ./cpm findings --learn | head -20
          ./cpm findings --compliance OWASP | head -10
        shell: bash
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cpm
          retention-days: 5

  lint-scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax check
        run: find lib checks -name '*.sh' -exec bash -n {} \;
      - name: install.sh syntax
        run: bash -n install.sh

  sonar:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build with coverage
        run: |
          make coverage 2>/dev/null || true
          # Convert gcov to sonar generic format
          mkdir -p .tmp/cov
          cd .tmp/cov && gcov *.gcda 2>/dev/null || true
          cd ../..
          # Generate XML for sonar
          python3 -c "
          import os, re
          lines = []
          lines.append('<coverage version=\"1\">')
          for f in os.listdir('.tmp/cov'):
            if not f.endswith('.gcov'): continue
            src = ''
            with open('.tmp/cov/' + f) as g:
              for line in g:
                m = re.match(r'.*Source:(.*)', line)
                if m: src = m.group(1).strip()
            if 'src/' not in src: continue
            lines.append(f'  <file path=\"{src}\">')
            with open('.tmp/cov/' + f) as g:
              for line in g:
                m = re.match(r'\s*(\d+):\s*(\d+):', line)
                if m and int(m.group(1)) > 0:
                  lines.append(f'    <lineToCover lineNumber=\"{m.group(2)}\" covered=\"true\"/>')
                elif m and m.group(1) == '0':
                  pass
            lines.append('  </file>')
          lines.append('</coverage>')
          with open('.tmp/cov/coverage.xml', 'w') as out:
            out.write('\n'.join(lines))
          " 2>/dev/null || true
      - uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
