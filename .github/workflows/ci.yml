name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      scripts: ${{ steps.filter.outputs.scripts }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'Makefile'
            scripts:
              - 'lib/**'
              - 'checks/**'
              - 'install.sh'
            docs:
              - '**/*.md'

  build:
    needs: changes
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: cpm-linux-amd64
          - os: macos-14
            artifact: cpm-macos-arm64
          # Windows: tracked in TODO.md, needs POSIX shim layer
          # - os: windows-latest
          #   artifact: cpm-windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
      - name: Install RE2
        if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
        run: |
          if [[ "${{ matrix.os }}" == ubuntu-* ]]; then
            sudo apt-get install -y libre2-dev
          else
            brew install re2
          fi
        shell: bash
      - name: Build
        if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
        run: make build
        shell: bash
      - name: Smoke test
        if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
        run: |
          ./cpm help
          ./cpm version
          ./cpm score
          ./cpm scan . --depth 1
          ./cpm findings --learn | head -20
          ./cpm findings --compliance OWASP | head -10
        shell: bash
      - name: Self-check (cpm on cpm)
        if: (needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main') && matrix.os == 'ubuntu-24.04'
        run: |
          # Install tools cpm needs for full check
          sudo apt-get install -y yamllint cppcheck shellcheck || true
          pip install cspell 2>/dev/null || true

          echo "=== cpm check (default tier) ==="
          ./cpm check || true

          echo ""
          echo "=== cpm scan . ==="
          ./cpm scan . --depth 1

          echo ""
          echo "=== cpm findings ==="
          ./cpm findings

          echo ""
          echo "=== rule-scan ==="
          make build/rule-scan && ./build/rule-scan --exit-zero || true
        shell: bash
      - name: Upload binary
        if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cpm
          retention-days: 5
      - name: Skip (no code changes)
        if: needs.changes.outputs.code != 'true' && github.ref != 'refs/heads/main'
        run: echo "✅ No C++ changes, skipping build"

  lint-scripts:
    needs: changes
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.scripts == 'true'
      - name: Shell syntax check
        if: needs.changes.outputs.scripts == 'true'
        run: find lib checks -name '*.sh' -exec bash -n {} \;
      - name: install.sh syntax
        if: needs.changes.outputs.scripts == 'true'
        run: bash -n install.sh
      - name: Shellcheck (errors only)
        if: needs.changes.outputs.scripts == 'true'
        run: find checks lib scripts -name '*.sh' -print0 | xargs -0 shellcheck -S error

  sonar:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gcovr
        run: pip install gcovr
      - name: Build cpm
        run: make build
      - name: Generate coverage for SonarCloud
        run: ./cpm coverage --sonar || true
      - uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  update-badges:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Build cpm
        run: make build
      - name: Update badges
        run: bash scripts/update-badges.sh
      - name: Commit badge updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update badges [skip ci]"
          git push || true
