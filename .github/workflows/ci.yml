name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      scripts: ${{ steps.filter.outputs.scripts }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'Makefile'
            scripts:
              - 'lib/**'
              - 'checks/**'
              - 'install.sh'
            docs:
              - '**/*.md'

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: cpm-linux-amd64
          - os: macos-14
            artifact: cpm-macos-arm64
          # Windows: tracked in TODO.md, needs POSIX shim layer
          # - os: windows-latest
          #   artifact: cpm-windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make build
        shell: bash
      - name: Smoke test
        run: |
          ./cpm help
          ./cpm version
          ./cpm score
          ./cpm scan . --depth 1
          ./cpm findings --learn | head -20
          ./cpm findings --compliance OWASP | head -10
        shell: bash
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cpm
          retention-days: 5

  lint-scripts:
    needs: changes
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.scripts == 'true'
      - name: Shell syntax check
        if: needs.changes.outputs.scripts == 'true'
        run: find lib checks -name '*.sh' -exec bash -n {} \;
      - name: install.sh syntax
        if: needs.changes.outputs.scripts == 'true'
        run: bash -n install.sh
      - name: Shellcheck (errors only)
        if: needs.changes.outputs.scripts == 'true'
        run: find checks lib scripts -name '*.sh' -print0 | xargs -0 shellcheck -S error

  sonar:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gcovr
        run: pip install gcovr
      - name: Build and test with coverage
        run: make coverage || true
      - name: Generate Sonar coverage report
        run: |
          gcovr .tmp/cov \
            --sonarqube .tmp/cov/coverage.xml \
            --root . \
            --filter 'src/' \
            --exclude '.*_test\.cpp' \
            --exclude 'vendor/' \
            || true
          echo "Coverage report:"
          wc -l .tmp/cov/coverage.xml 2>/dev/null || echo "No coverage generated"
      - uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
