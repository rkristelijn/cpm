name: Release

# Two-phase release that respects branch protection on main:
#
#   Phase 1 — this workflow (workflow_dispatch):
#     Computes the next version and opens a "chore/release-vX.Y.Z" PR that
#     bumps cpm.toml + commands.h + CHANGELOG. No direct push to main.
#     dry_run=true previews the bump and builds all platforms without a PR.
#
#   Phase 2 — release-publish.yml (on: push tags 'v*'):
#     After the bump PR is merged, pushing the vX.Y.Z tag builds all
#     platforms and publishes the GitHub release + Homebrew formula.
#
# So a normal release is: run this → review/merge the PR → push the tag.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — compute version + build all platforms, but do NOT open a PR or tag"
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      skipped: ${{ steps.bump.outputs.skipped }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine version
        id: bump
        run: |
          BUMP_OUTPUT=$(bash scripts/release.sh bump 2>&1 | head -1)
          VERSION=$(echo "$BUMP_OUTPUT" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | tail -1) || {
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "No commits to release"
            exit 0
          }
          if [ -z "$VERSION" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Could not determine version from: $BUMP_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::DRY RUN — would open a bump PR for v${VERSION} ($BUMP_OUTPUT)"
          else
            echo "Preparing bump PR: $BUMP_OUTPUT → v${VERSION}"
          fi

      - name: Preview bump (dry run)
        if: steps.bump.outputs.skipped == 'false' && inputs.dry_run == true
        run: |
          echo "=== DRY RUN: version bump preview (not committed) ==="
          bash scripts/release.sh apply "${{ steps.bump.outputs.version }}"
          echo "--- cpm.toml ---";  grep '^version' cpm.toml
          echo "--- commands.h ---"; grep 'CPM_VERSION "' src/commands/commands.h
          echo "--- CHANGELOG head ---"; sed -n '1,12p' CHANGELOG.md

      - name: Open release bump PR
        if: steps.bump.outputs.skipped == 'false' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          BRANCH="chore/release-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/release.sh apply "$VERSION"

          if git diff --quiet cpm.toml src/commands/commands.h CHANGELOG.md; then
            # Version is already applied on main (e.g. bumped earlier by hand).
            # Nothing to bump — go straight to tagging to trigger the publish.
            echo "::notice::v${VERSION} already applied on main — tagging directly (no bump PR needed)."
            if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
              echo "::notice::Tag v${VERSION} already exists — nothing to do."
            else
              git tag -a "v${VERSION}" -m "Release v${VERSION}"
              git push origin "v${VERSION}"
              echo "::notice::Pushed tag v${VERSION}."
            fi
            # A tag pushed by GITHUB_TOKEN does not trigger 'on: push' workflows,
            # so kick off release-publish explicitly for this tag.
            gh workflow run "Release Publish" --ref main -f tag="v${VERSION}"
            echo "::notice::Triggered release-publish for v${VERSION}."
            exit 0
          fi

          # Normal path: open a bump PR (respects branch protection on main).
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          git add cpm.toml src/commands/commands.h CHANGELOG.md
          git commit -m "chore: release v${VERSION}"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: release v${VERSION}" \
            --body "Automated release bump for **v${VERSION}**.

          Bumps \`cpm.toml\`, \`src/commands/commands.h\`, and rolls \`CHANGELOG.md\`.

          After merging this PR, push the tag to publish:
          \`\`\`
          git checkout main && git pull
          git tag -a v${VERSION} -m 'Release v${VERSION}' && git push origin v${VERSION}
          \`\`\`
          The **release-publish** workflow then builds all platforms and creates the GitHub release + Homebrew formula." \
            2>/dev/null || gh pr edit "$BRANCH" --title "chore: release v${VERSION}" || true
          echo "::notice::Opened release PR for v${VERSION} on branch ${BRANCH}. Merge it, then push tag v${VERSION}."

  build:
    needs: release
    if: needs.release.outputs.skipped == 'false' && inputs.dry_run == true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: cpm-linux-amd64
          - os: ubuntu-24.04
            artifact: cpm-linux-amd64-static
            cxxflags: "-static"
          - os: macos-14
            artifact: cpm-macos-arm64
          - os: macos-14
            artifact: cpm-macos-amd64
            cxxflags: "-arch x86_64"
            no_re2: "1"
          - os: windows-latest
            artifact: cpm-windows-amd64
            no_re2: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Install RE2
        if: matrix.os != 'windows-latest' && matrix.no_re2 != '1'
        run: |
          if [[ "${{ matrix.os }}" == ubuntu-* ]]; then
            sudo apt-get install -y libre2-dev
          else
            brew install re2
          fi
        shell: bash
      - name: Build and test
        run: |
          if [[ "${{ matrix.no_re2 }}" == "1" ]]; then
            # No RE2 (Windows, macOS x86_64 cross-build): rule engine disabled.
            # Skip 'smoke' — the x86_64 binary can't run on the arm64 runner,
            # and Windows has its own smoke path.
            make build
          else
            make build smoke
          fi
        shell: bash
        env:
          EXTRA_CXXFLAGS: "${{ matrix.cxxflags || '' }}"
          CPM_NO_RE2: "${{ matrix.no_re2 || '' }}"
      - name: Build rule-scan
        if: matrix.os != 'windows-latest' && matrix.no_re2 != '1'
        run: make build/rule-scan
        shell: bash
