name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      skipped: ${{ steps.bump.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: bump
        run: |
          VERSION=$(bash scripts/release.sh apply 2>&1) || {
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION"
            exit 0
          }
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        if: steps.bump.outputs.skipped == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/commands/commands.h cpm.toml
          git commit -m "chore: release ${{ steps.bump.outputs.version }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin main --tags

  build:
    needs: release
    if: needs.release.outputs.skipped == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: cpm-linux-amd64
          - os: macos-14
            artifact: cpm-macos-arm64
          - os: macos-14
            artifact: cpm-macos-amd64
            cxxflags: "-arch x86_64"
          - os: windows-latest
            artifact: cpm-windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Build and test
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            make build
          else
            make build smoke
          fi
        shell: bash
        env:
          CXXFLAGS: "-Wall -Wextra -std=c++17 -O2 ${{ matrix.cxxflags || '' }}"
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cpm
          retention-days: 1

  publish:
    needs: [release, build]
    if: always() && needs.release.outputs.skipped == 'false' && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package and release
        run: |
          mkdir -p release
          for dir in artifacts/cpm-*/; do
            name=$(basename "$dir")
            chmod +x "$dir/cpm"
            tar czf "release/${name}.tar.gz" -C "$dir" cpm
          done

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          generate_release_notes: true
          files: release/*.tar.gz

      - name: Update Homebrew formula
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          SHA_ARM64=$(shasum -a 256 release/cpm-macos-arm64.tar.gz | cut -d' ' -f1)
          SHA_AMD64=$(shasum -a 256 release/cpm-macos-amd64.tar.gz | cut -d' ' -f1)
          SHA_LINUX=$(shasum -a 256 release/cpm-linux-amd64.tar.gz | cut -d' ' -f1)
          mkdir -p Formula
          bash scripts/formula.sh "$VERSION" "$SHA_ARM64" "$SHA_AMD64" "$SHA_LINUX" > Formula/cpm.rb

      - name: Commit formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cpm.rb
          git commit -m "chore(brew): update formula to v${{ needs.release.outputs.version }}"
          git push origin main
