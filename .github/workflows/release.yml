name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build all platforms + compute version, but do NOT commit, tag, or publish"
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      ref: ${{ steps.bump.outputs.ref }}
      skipped: ${{ steps.bump.outputs.skipped }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine version
        id: bump
        run: |
          BUMP_OUTPUT=$(bash scripts/release.sh bump 2>&1 | head -1)
          VERSION=$(echo "$BUMP_OUTPUT" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | tail -1) || {
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "No commits to release"
            exit 0
          }
          if [ -z "$VERSION" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Could not determine version from: $BUMP_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            # Dry run: build jobs check out the current commit (no tag created).
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "::notice::DRY RUN — would release $BUMP_OUTPUT → v${VERSION} (no commit/tag/publish)"
          else
            echo "ref=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Release: $BUMP_OUTPUT → v${VERSION}"
          fi

      - name: Update cpm.toml version
        if: steps.bump.outputs.skipped == 'false' && inputs.dry_run != true
        run: |
          bash scripts/release.sh apply "${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cpm.toml src/commands/commands.h CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]" || true
          git push || true

      - name: Preview bump (dry run)
        if: steps.bump.outputs.skipped == 'false' && inputs.dry_run == true
        run: |
          echo "=== DRY RUN: version bump preview (not committed) ==="
          bash scripts/release.sh apply "${{ steps.bump.outputs.version }}"
          echo "--- cpm.toml ---";  grep '^version' cpm.toml
          echo "--- commands.h ---"; grep 'CPM_VERSION "' src/commands/commands.h
          echo "--- CHANGELOG head ---"; sed -n '1,12p' CHANGELOG.md

      - name: Create tag
        if: steps.bump.outputs.skipped == 'false' && inputs.dry_run != true
        run: |
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"

  build:
    needs: release
    if: needs.release.outputs.skipped == 'false'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: cpm-linux-amd64
          - os: ubuntu-24.04
            artifact: cpm-linux-amd64-static
            cxxflags: "-static"
          - os: macos-14
            artifact: cpm-macos-arm64
          - os: macos-14
            artifact: cpm-macos-amd64
            cxxflags: "-arch x86_64"
            no_re2: "1"
          - os: windows-latest
            artifact: cpm-windows-amd64
            no_re2: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.ref }}
      - name: Install RE2
        if: matrix.os != 'windows-latest' && matrix.no_re2 != '1'
        run: |
          if [[ "${{ matrix.os }}" == ubuntu-* ]]; then
            sudo apt-get install -y libre2-dev
          else
            brew install re2
          fi
        shell: bash
      - name: Build and test
        run: |
          if [[ "${{ matrix.no_re2 }}" == "1" ]]; then
            # No RE2 (Windows, macOS x86_64 cross-build): rule engine disabled.
            # Skip 'smoke' — the x86_64 binary can't run on the arm64 runner,
            # and Windows has its own smoke path.
            make build
          else
            make build smoke
          fi
        shell: bash
        env:
          EXTRA_CXXFLAGS: "${{ matrix.cxxflags || '' }}"
          CPM_NO_RE2: "${{ matrix.no_re2 || '' }}"
      - name: Build rule-scan
        if: matrix.os != 'windows-latest' && matrix.no_re2 != '1'
        run: make build/rule-scan
        shell: bash
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            cpm
            build/rule-scan
          retention-days: 1

  publish:
    needs: [release, build]
    if: always() && needs.release.outputs.skipped == 'false' && needs.release.result == 'success' && inputs.dry_run != true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.ref }}

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package and release
        run: |
          mkdir -p release
          for dir in artifacts/cpm-*/; do
            name=$(basename "$dir")
            chmod +x "$dir/cpm" 2>/dev/null || true
            chmod +x "$dir/build/rule-scan" 2>/dev/null || true
            # Bundle rule-scan alongside cpm if it exists (not on Windows)
            if [ -f "$dir/build/rule-scan" ]; then
              cp "$dir/build/rule-scan" "$dir/rule-scan"
              tar czf "release/${name}.tar.gz" -C "$dir" cpm rule-scan
            else
              tar czf "release/${name}.tar.gz" -C "$dir" cpm
            fi
          done

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          generate_release_notes: true
          files: release/*.tar.gz

      - name: Update Homebrew formula
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          SHA_ARM64=$(shasum -a 256 release/cpm-macos-arm64.tar.gz | cut -d' ' -f1)
          SHA_AMD64=$(shasum -a 256 release/cpm-macos-amd64.tar.gz | cut -d' ' -f1)
          SHA_LINUX=$(shasum -a 256 release/cpm-linux-amd64.tar.gz | cut -d' ' -f1)
          mkdir -p Formula
          bash scripts/formula.sh "$VERSION" "$SHA_ARM64" "$SHA_AMD64" "$SHA_LINUX" > Formula/cpm.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cpm.rb
          git diff --cached --quiet || {
            git commit -m "chore(brew): update formula to v${VERSION}"
            git push origin HEAD:refs/heads/chore/brew-v${VERSION}
          }
