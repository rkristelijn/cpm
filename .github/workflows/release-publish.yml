name: Release Publish

# Phase 2 of the release (see release.yml for phase 1).
# Builds all platforms and publishes the GitHub release + Homebrew formula.
#
# Triggered two ways:
#   - push of a vX.Y.Z tag (works when the tag is pushed by a user/PAT)
#   - workflow_dispatch with a 'tag' input (used by release.yml, because a tag
#     pushed by GITHUB_TOKEN does NOT trigger 'on: push' workflows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build & publish (e.g. v0.10.0)"
        type: string
        required: true

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: cpm-linux-amd64
          - os: ubuntu-24.04
            artifact: cpm-linux-amd64-static
            cxxflags: "-static"
          - os: macos-14
            artifact: cpm-macos-arm64
          - os: macos-14
            artifact: cpm-macos-amd64
            cxxflags: "-arch x86_64"
            no_re2: "1"
          - os: windows-latest
            artifact: cpm-windows-amd64
            no_re2: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Install RE2
        if: matrix.os != 'windows-latest' && matrix.no_re2 != '1'
        run: |
          if [[ "${{ matrix.os }}" == ubuntu-* ]]; then
            sudo apt-get install -y libre2-dev
          else
            brew install re2
          fi
        shell: bash
      - name: Build and test
        run: |
          if [[ "${{ matrix.no_re2 }}" == "1" ]]; then
            # No RE2 (Windows, macOS x86_64 cross-build): rule engine disabled.
            # Skip 'smoke' — the x86_64 binary can't run on the arm64 runner,
            # and Windows has its own smoke path.
            make build
          else
            make build smoke
          fi
        shell: bash
        env:
          EXTRA_CXXFLAGS: "${{ matrix.cxxflags || '' }}"
          CPM_NO_RE2: "${{ matrix.no_re2 || '' }}"
      - name: Build rule-scan
        if: matrix.os != 'windows-latest' && matrix.no_re2 != '1'
        run: make build/rule-scan
        shell: bash
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            cpm
            build/rule-scan
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package and release
        run: |
          mkdir -p release
          for dir in artifacts/cpm-*/; do
            name=$(basename "$dir")
            chmod +x "$dir/cpm" 2>/dev/null || true
            chmod +x "$dir/build/rule-scan" 2>/dev/null || true
            # Bundle rule-scan alongside cpm if it exists (not on Windows)
            if [ -f "$dir/build/rule-scan" ]; then
              cp "$dir/build/rule-scan" "$dir/rule-scan"
              tar czf "release/${name}.tar.gz" -C "$dir" cpm rule-scan
            else
              tar czf "release/${name}.tar.gz" -C "$dir" cpm
            fi
          done

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release/*.tar.gz

      - name: Update Homebrew formula
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"; VERSION="${TAG#v}"
          SHA_ARM64=$(shasum -a 256 release/cpm-macos-arm64.tar.gz | cut -d' ' -f1)
          SHA_AMD64=$(shasum -a 256 release/cpm-macos-amd64.tar.gz | cut -d' ' -f1)
          SHA_LINUX=$(shasum -a 256 release/cpm-linux-amd64.tar.gz | cut -d' ' -f1)
          mkdir -p Formula
          bash scripts/formula.sh "$VERSION" "$SHA_ARM64" "$SHA_AMD64" "$SHA_LINUX" > Formula/cpm.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cpm.rb
          git diff --cached --quiet || {
            git commit -m "chore(brew): update formula to v${VERSION}"
            git push origin "HEAD:refs/heads/chore/brew-v${VERSION}"
          }
