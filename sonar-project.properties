sonar.organization=rkristelijn
sonar.projectKey=rkristelijn_cpm
sonar.projectName=cpm

sonar.sources=src,lib,checks
sonar.tests=tests
sonar.test.inclusions=**/*_test.cpp,**/*_test.sh,tests/**
sonar.exclusions=vendor/**,build/**,.tmp/**,node_modules/**,react-docs/**,kubernetes-docs/**

# Duplication: check definitions are intentionally repetitive (struct arrays)
sonar.cpd.minimumTokens=80
sonar.cpd.minimumLines=15
sonar.cpd.exclusions=src/checks.cpp,src/scan/learn.h,src/scan/compliance.h,**/*_test.*,checks/javascript/**

# Coverage (generated in CI sonar job)
sonar.coverageReportPaths=.tmp/cov/coverage.xml

# CLI commands are tested via e2e (cpm init, cpm check, cpm scan)
# not unit tests — exclude from new-code coverage gate
# Shell scripts are tested via e2e, not instrumented for line coverage
sonar.coverage.exclusions=src/commands/**,src/main.cpp,src/checks.cpp,src/common/setup.cpp,src/common/toml.cpp,src/common/runner.cpp,checks/**/*.sh,scripts/**/*.sh,lib/**/*.sh,docs/fixes/**

# Security hotspots: cpm is a CLI tool that intentionally executes shell commands.
# Mark as "Won't Fix" on SonarCloud dashboard for hotspots in these files.
# sonar.security.exclusions is not a valid property — use issue.ignore instead:
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=cpp:S5801
sonar.issue.ignore.multicriteria.e1.resourceKey=src/common/runner.cpp

# Reset New Code Period on each release
sonar.projectVersion=0.5.0
